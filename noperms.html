<!DOCTYPE html>
<html lang="pt-br">
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📙</text></svg>">
  <title>Não Aprovado</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1" >
  <link href="style.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Teko:wght@300..700&display=swap" rel="stylesheet">
  </head>
<body>
  <h1>Ops!</h1>
  <h2>Sua conta ainda não tem acesso ao site. Se você já pagou, entre em contato para receber a aprovação.</h2>
  <style>
    h1 {
      text-align: center;
      font-family: outfit;
      font-size: 80px;
      text-shadow: 12px 12px 0 rgba(0,0,0,0.5);
    }
    h2 {
      font-family: outfit;
      max-width: 80vw;
      text-align: center;
      margin: 0 auto;
      font-size: 25px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="auth.js"></script>
  <script>
    (async () => {
      await new Promise(resolve => setTimeout(resolve, 5000));
      await window.supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    })();
  </script>
</body>
</html>
